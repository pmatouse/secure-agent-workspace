# Nested lab storage makes initial operator image pulls slow. Keep this
# recovery policy declarative; OLM owns failed unpack Job cleanup/retry.
portal:
  # Two cold agent images plus nested-CPU guest configuration approach 30m.
  # Keep real readiness checks; this only bounds new portal runs' wait time.
  sandboxReadyTimeoutMinutes: 60

keycloak:
  instances: 1
  resources:
    requests:
      cpu: 500m
      memory: 1700Mi
    limits:
      memory: 2Gi

clusterGroup:
  applications:
    saw-kubernetes-foundation:
      name: saw-kubernetes-foundation
      namespace: openshell-agents
      path: overrides/kubernetes-qualification
      kustomize: true
  subscriptions:
    sandboxed-containers:
      name: sandboxed-containers-operator
      namespace: openshift-sandboxed-containers-operator
      channel: stable
      csv: sandboxed-containers-operator.v1.13.1
      installPlanApproval: Automatic
    openshift-virtualization:
      # OLM applies resources to every operator container in this bundle.
      # Preserve at least the largest original requests (200m / 450Mi).
      # This improves CPU scheduling weight inside the nested cluster;
      # it cannot reserve CPU on the outer RHDP hypervisor.
      config:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
  namespaces:
    openshift-sandboxed-containers-operator:
      operatorGroup: true
      targetNamespaces:
        - openshift-sandboxed-containers-operator
    external-secrets-operator:
      # clustergroup 0.9.58's map-form namespace helper does not forward
      # OperatorGroup annotations. Render the same object via extraObjects.
      operatorGroup: false
  extraObjects:
    external-secrets-operator-group:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: external-secrets-operator-operator-group
        namespace: external-secrets-operator
        annotations:
          operatorframework.io/bundle-unpack-timeout: 30m
          operatorframework.io/bundle-unpack-min-retry-interval: 10m
      # No targetNamespaces: preserve the existing all-namespaces scope.
