portal:
  sandboxReadyTimeoutMinutes: 60
keycloak:
  instances: 1
  resources:
    requests:
      cpu: 500m
      memory: 1700Mi
    limits:
      memory: 2Gi
clusterGroup:
  applications:
    saw-agent-sandbox:
      name: saw-agent-sandbox
      namespace: agent-sandbox-system
      path: charts/agent-sandbox
      overrides:
      - name: enabled
        value: 'true'
    governance-interceptor:
      extraValueFiles:
      - /overrides/clean-governance.yaml
    openshell-rhdh:
      extraValueFiles:
      - /overrides/saw-users.yaml
      - /overrides/clean-portal.yaml
    saw-image-cache:
      name: saw-image-cache
      namespace: saw-image-cache
      path: charts/saw-image-cache
      extraValueFiles:
      - /overrides/workspace-image-cache.yaml
  subscriptions:
    openshift-virtualization:
      config:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
  namespaces:
    external-secrets-operator:
      operatorGroup: false
    saw-image-cache:
      operatorGroup: false
  extraObjects:
    external-secrets-operator-group:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: external-secrets-operator-operator-group
        namespace: external-secrets-operator
        annotations:
          operatorframework.io/bundle-unpack-timeout: 30m
          operatorframework.io/bundle-unpack-min-retry-interval: 10m
    bootstrap-resources:
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: bootstrap-requests
        namespace: imperative
      spec:
        limits:
        - type: Container
          defaultRequest:
            cpu: '1'
            memory: 256Mi
    qualification-governance-pull:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: clean-governance-pull
        namespace: saw-pr153-build
      rules:
      - apiGroups:
        - image.openshift.io
        resources:
        - imagestreams/layers
        resourceNames:
        - bootstrap-governance
        verbs:
        - get
    qualification-governance-pull-binding:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: clean-governance-pull
        namespace: saw-pr153-build
      subjects:
      - kind: ServiceAccount
        name: default
        namespace: openshell-agents
      roleRef:
        kind: Role
        apiGroup: rbac.authorization.k8s.io
        name: clean-governance-pull
    image-cache-role:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: cache-read-approved-openclaw
        namespace: saw-pr153-build
      rules:
      - apiGroups:
        - image.openshift.io
        resources:
        - imagestreams/layers
        resourceNames:
        - qualification-openclaw
        verbs:
        - get
    image-cache-binding:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: cache-read-approved-openclaw
        namespace: saw-pr153-build
      subjects:
      - kind: ServiceAccount
        name: saw-image-cache
        namespace: saw-image-cache
      roleRef:
        kind: Role
        apiGroup: rbac.authorization.k8s.io
        name: cache-read-approved-openclaw
  imperative:
    ansibleDevMode:
      enabled: true
      requirementsFile: saw-pinned-collections.yml
      requirementsContent: "collections:\n- name: https://github.com/pmatouse/rhvp.cluster_utils.git\n  type: git\n  version:\
        \ ce0af1b7f25a0a9f288041e2bd3c1d7d08e35e29\n"
      ansibleCfgContent: '[defaults]

        localhost_warning=False

        retry_files_enabled=False

        # Retry files disabled to avoid cluttering CI/CD environments

        interpreter_python=auto_silent

        timeout=30

        library=~/.ansible/plugins/modules:./ansible/plugins/modules:/usr/share/ansible/plugins/modules

        roles_path=~/.ansible/roles:./ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

        filter_plugins=~/.ansible/plugins/filter:./ansible/plugins/filter:/usr/share/ansible/plugins/filter

        # use the collections from the util. container,

        # change below if you want to test local collections

        collections_path=/git/home/.ansible/collections:/usr/share/ansible/collections


        [inventory]

        inventory_unparsed_warning=False

        '
global:
  webSearch:
    enabled: false
