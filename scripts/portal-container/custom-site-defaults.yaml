# Fixed OpenAI demo defaults and reviewed chart pins. $input values are filled by render-site.py.
modelLifecycle: true
governanceNamespace:
  $input: governanceNamespace
subject:
  $input: subject
stack:
  identity:
    revision: e16968b8e37f1b4cb96597149bb3218792b34e06
    values:
      enabled: true
      ownerID: '@INSTALLATION@'
      targetNamespace: '@RUNTIME@'
      gateway: '@OWNER@'
      adminDays: 30
      serverSans:
      - '@OWNER@-gateway.@RUNTIME@.svc'
      - '@OWNER@-gateway.@RUNTIME@.svc.cluster.local'
  policy:
    revision: 62f97067497e408051d57fc12c3d492026c097fe
    values:
      enabled: true
      targetNamespace: '@RUNTIME@'
      gatewayId: '@OWNER@'
      gatewayServiceAccount: '@OWNER@-gateway'
      sandboxServiceAccount: '@OWNER@-sandbox'
      mode: container
      network:
        priority:
          $input: networkPriority
        egress:
        - name: dns
          to:
          - pods:
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-dns
              podSelector:
                matchLabels:
                  dns.operator.openshift.io/daemonset-dns: default
          ports:
          - portNumber:
              protocol: UDP
              port: 53
          - portNumber:
              protocol: TCP
              port: 53
          - portNumber:
              protocol: UDP
              port: 5353
          - portNumber:
              protocol: TCP
              port: 5353
        - name: gateway
          to:
          - pods:
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: '@RUNTIME@'
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: '@OWNER@'
                  openshell.pattern/role: gateway
          ports:
          - portNumber:
              protocol: TCP
              port: 17670
        - name: workload-boundary
          to:
          - pods:
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: '@RUNTIME@'
              podSelector:
                matchLabels:
                  openshell.ai/boundary-role: workload
          ports:
          - portNumber:
              protocol: TCP
              port: 5500
        - name: credential-proxy
          to:
          - pods:
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: '@TRUSTED@'
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: '@OWNER@'
                  openshell.pattern/role: credential-proxy
          ports:
          - portNumber:
              protocol: TCP
              port: 3128
  proxy:
    revision: 7eb8463cdea3c5803ab5ab84322b9163ac6c1c55
    values:
      enabled: true
      ownerID: '@INSTALLATION@'
      gateway: '@OWNER@'
      targetNamespace: '@RUNTIME@'
      policyConfigMap: '@OWNER@-proxy-policy'
      credentialSecretNames:
      - inference
      network:
        bootstrapEgress:
        - $input: apiRule
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: openshift-dns
            podSelector:
              matchLabels:
                dns.operator.openshift.io/daemonset-dns: default
          ports:
          - protocol: UDP
            port: 53
          - protocol: UDP
            port: 5353
          - protocol: TCP
            port: 53
          - protocol: TCP
            port: 5353
        proxyEgress:
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: openshift-dns
            podSelector:
              matchLabels:
                dns.operator.openshift.io/daemonset-dns: default
          ports:
          - protocol: UDP
            port: 53
          - protocol: UDP
            port: 5353
          - protocol: TCP
            port: 53
          - protocol: TCP
            port: 5353
        - $input: internetRule
  gateway:
    revision: 7eb8463cdea3c5803ab5ab84322b9163ac6c1c55
    values:
      deployment:
        mode: container
      kubernetes:
        experimental: true
        workload:
          image: registry.access.redhat.com/ubi9/python-311@sha256:7b6cb58d3ff034df7b300800bd89a469d9bd2f739d43250d76b9c9e805307ab5
        identity:
          serverTlsSecret: '@OWNER@-server'
          clientCaSecret: '@OWNER@-client-ca'
          jwtSecret: '@OWNER@-jwt'
          credentialKeySecret: '@OWNER@-kek'
        storage:
          className:
            $input: gatewayStorage
          gatewaySize: 1Gi
          workspaceSize: 1Gi
        proxy:
          url: http://@OWNER@-credential-proxy.@TRUSTED@.svc:3128
          caConfigMap: '@OWNER@-proxy-ca'
        governance:
          endpoint:
            $input: governanceEndpoint
        network:
          reconcilerNamespace: '@TRUSTED@'
          reconcilerLabels:
            app.kubernetes.io/instance: '@OWNER@'
            openshell.pattern/role: reconciler
          gatewayEgress:
          - $input: apiRule
          - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-dns
              podSelector:
                matchLabels:
                  dns.operator.openshift.io/daemonset-dns: default
            ports:
            - protocol: UDP
              port: 53
            - protocol: UDP
              port: 5353
            - protocol: TCP
              port: 53
            - protocol: TCP
              port: 5353
          - $input: issuerRule
          - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name:
                    $input: governanceNamespace
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: governance-interceptor
            ports:
            - protocol: TCP
              port: 18081
          - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: '@TRUSTED@'
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: '@OWNER@'
                  openshell.pattern/role: credential-proxy
            ports:
            - protocol: TCP
              port: 3128
      oidc:
        issuerUrl:
          $input: issuer
      route:
        enabled: false
  audit:
    revision: 661194fd49c75b4e7dd202d4d2ad5fa7b04934e3
    values:
      enabled: true
      trustedNamespace: '@ARCHIVE@'
      runtimeNamespace: '@RUNTIME@'
      ownerID: '@INSTALLATION@'
      storageClass:
        $input: historyStorage
      exchangeStorageClass:
        $input: exchangeStorage
      image: ghcr.io/openclaw/openclaw@sha256:0a5ff5e682e62afa19149df126aa50063bf65ef885b5c94713ce32dc0eb12e15
      identity:
        subject: '@SUBJECT@'
        username: '@OWNER@'
        workspace: agent
        sandbox: audited
automaticEnrollment:
  image:
    $input: controllerImage
  revision:
    $input: controllerRevision
  buildNamespace:
    $input: buildNamespace
  profileSHA256:
    $input: bomDigest
  resources:
    limits:
      cpu: '2'
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  reference:
    $input: reference
  relay:
    keycloakNamespace:
      $input: keycloakNamespace
    keycloakAdminSecret:
      $input: keycloakAdminSecret
    issuer:
      $input: issuer
    egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-dns
        podSelector:
          matchLabels:
            dns.operator.openshift.io/daemonset-dns: default
      ports:
      - protocol: UDP
        port: 53
      - protocol: UDP
        port: 5353
      - protocol: TCP
        port: 53
      - protocol: TCP
        port: 5353
    - $input: issuerRule
    revision: 661194fd49c75b4e7dd202d4d2ad5fa7b04934e3
  approvedProfiles:
    $input: approvedProfiles
profileImageOverrides:
  $input: profileImageOverrides
imagePull:
  namespace:
    $input: buildNamespace
  streams:
  - saw-openclaw-home
profileBoundaries:
  $input: profileBoundaries
