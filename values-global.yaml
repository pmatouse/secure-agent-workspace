global:
  pattern: secure-agent-workspace
  singleArgoCD: true
  secretLoader:
    disabled: false
  # Turn off when Vault has no web-search key. Per-user webSearch.enabled wins.
  # Or install with: ./pattern.sh make install WEB_SEARCH_ENABLED=false
  webSearch:
    enabled: true
  # Which service governs every SAW gateway (docs/apf.md):
  #   interceptor  the OpenShell governance interceptor (default)
  #   apf          NVIDIA Agent Policy Fabric: private images on ghcr.io, so
  #                values-secret.yaml needs the ghcr and apf-signing entries,
  #                and charts/governance-interceptor/files/apf needs a signed
  #                bundle you generate (make apf-keys apf-bundle, docs/apf.md).
  # Leave interceptor here and pick APF per install instead:
  #   ./pattern.sh make install GOVERNANCE_ENGINE=apf
  governance:
    engine: interceptor
main:
  clusterGroupName: prod
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: ""
    clusterGroupGitRepoUrl: https://github.com/pmatouse/clustergroup-chart.git
    clusterGroupChartGitRevision: 620f7a5d89717a92c0fd6dc6efd018b776dc84e7
