apiVersion: v1
kind: ConfigMap
metadata:
  name: saw-audit-probe-2bb37efc3015
  namespace: saw-runtime-smoke
  annotations:
    argocd.argoproj.io/sync-wave: '0'
immutable: true
data:
  check.py: "import errno, json, os, sys\nfrom pathlib import Path\nfrom uuid import\
    \ uuid4\nlog = Path(\"/audit/log/tool-actions.jsonl\")\nmode = sys.argv[1]\nif\
    \ mode == \"write\":\n    with log.open(\"a\") as f:\n        f.write(json.dumps({\"\
    probe\": str(uuid4())}) + \"\\n\")\n        f.flush()\n        os.fsync(f.fileno())\n\
    else:\n    records = [json.loads(x) for x in log.read_text().splitlines()]\n \
    \   assert len(records) >= 1 and all(\"probe\" in r for r in records)\n    def\
    \ forbidden(op):\n        try:\n            op()\n        except PermissionError\
    \ as error:\n            assert error.errno == errno.EPERM\n            return\n\
    \        raise RuntimeError(\"audit history could be changed\")\n    forbidden(lambda:\
    \ os.close(os.open(log, os.O_WRONLY)))\n    with log.open(\"a\") as out:\n   \
    \     forbidden(lambda: os.ftruncate(out.fileno(), 0))\n    forbidden(log.unlink)\n\
    \    print(json.dumps({\"previousPodRecords\":len(records), \"openWithoutAppend\"\
    :\"EPERM\",\n                      \"truncate\":\"EPERM\", \"unlink\":\"EPERM\"\
    , \"uid\":os.getuid()}))\n"
---
