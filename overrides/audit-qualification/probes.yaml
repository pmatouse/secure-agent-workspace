          claimName: saw-audit-qualification
      - name: check
        configMap:
          name: saw-audit-probe-2bb37efc3015
      containers:
      - name: check
        image: registry.access.redhat.com/ubi9/python-311@sha256:7b6cb58d3ff034df7b300800bd89a469d9bd2f739d43250d76b9c9e805307ab5
        command:
        - python3
