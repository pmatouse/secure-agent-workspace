apiVersion: v1
kind: ConfigMap
metadata:
  name: saw-gate-check-f92b9a5ec696-49954f62
  namespace: saw-runtime-smoke
immutable: true
data:
  check.mjs: "// Run with the stock OpenClaw image and the shared gate projected read-only.\n\
    import assert from \"node:assert/strict\";\nimport fs from \"node:fs\";\nimport\
    \ { execFileSync } from \"node:child_process\";\nimport { randomUUID } from \"\
    node:crypto\";\nimport { handleBeforeToolCall } from \"/sandbox/.saw/trusted/plugin/index.js\"\
    ;\nimport { AUDIT_PATH, POLICY_PATH, IDENTITY_PATH } from \"/sandbox/.saw/trusted/plugin/tool-gate.mjs\"\
    ;\n\nconst identity = JSON.parse(fs.readFileSync(IDENTITY_PATH));\nconst config\
    \ = {plugins: {allow: [\"saw-tool-gate\"], load: {paths: [\"/sandbox/.saw/trusted/plugin\"\
    ]},\n                          entries: {\"saw-tool-gate\": {enabled: true}}}};\n\
    fs.writeFileSync(process.env.OPENCLAW_CONFIG_PATH, JSON.stringify(config), {mode:\
    \ 0o600});\nconst listed = JSON.parse(execFileSync(\"openclaw\", [\"plugins\"\
    , \"list\", \"--json\"], {encoding: \"utf8\"}));\nconst gate = listed.plugins.find(p\
    \ => p.id === \"saw-tool-gate\");\nassert.equal(gate?.enabled, true);\nassert.equal(gate?.status,\
    \ \"loaded\");\nassert.equal(gate?.rootDir, fs.realpathSync(\"/sandbox/.saw/trusted/plugin\"\
    ));\nassert.throws(() => fs.openSync(POLICY_PATH, \"r+\"), {code: \"EROFS\"});\n\
    const ctx = {sessionKey: randomUUID()};\nfunction call(toolName, params = {})\
