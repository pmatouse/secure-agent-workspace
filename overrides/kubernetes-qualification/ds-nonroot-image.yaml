apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: saw-workspace-home-access, namespace: vp-gitops, finalizers: [resources-finalizer.argocd.argoproj.io/foreground]}
spec:
  project: default
  destination: {namespace: saw-k8s-build, server: 'https://kubernetes.default.svc'}
  source:
    repoURL: https://github.com/pmatouse/secure-agent-workspace.git
    targetRevision: 0e6912d55ac16ea1788b26b8d6c2fde8df47d0b0
    path: image-builder-charts/helm/openshift-home-access
    helm:
      valuesObject:
        images:
          - name: saw-openclaw-home
            from: quay.io/aipcc/base-images/agentic/openclaw@sha256:896d1526ee29b53167034ba65d1c758c8da777f441ed094e19f3bcf6d7445c61
            imageUser: sandbox:sandbox
  syncPolicy: {automated: {prune: true, selfHeal: true}}

