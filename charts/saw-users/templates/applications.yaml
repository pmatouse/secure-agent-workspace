{{- include "saw-users.validate" . -}}
{{- range $user := .Values.users | default list }}
{{- $container := eq (dig "deployment" "mode" "vm" ($user.values | default dict)) "container" }}
{{- if not $container }}
---
{{ include "saw-users.application" (dict
  "root" $
  "user" $user
  "appName" (printf "saw-%s-secrets" $user.name)
  "wave" $.Values.syncWave.secrets
  "path" "charts/pattern-secrets"
  "release" (printf "saw-%s-secrets" $user.name)
  "values" (include "saw-users.vaultPrefix" (dict "root" $ "user" $user))
) }}
{{- end }}
---
{{ include "saw-users.application" (dict
  "root" $
  "user" $user
  "appName" (printf "saw-%s-bom" $user.name)
  "wave" $.Values.syncWave.bom
  "path" "charts/saw-bom"
  "release" (printf "saw-%s-bom" $user.name)
  "values" (include "saw-users.profiles" (dict "root" $ "user" $user))
) }}
---
{{- if $container }}
{{ $values := dict "owner" $user.name "ownerSubject" $user.ownerSubject "registration" $user.registration "vaultPrefix" $user.vaultPrefix "installationID" $user.installationID "intentGeneration" $user.intentGeneration "site" (index $.Values.containerSites $user.name) "global" $.Values.global }}
{{ include "saw-users.application" (dict "root" $ "user" $user "appName" (printf "saw-%s" $user.name) "wave" $.Values.syncWave.sandbox "path" "charts/saw-portal-container" "release" $user.name "values" (toYaml $values)) }}
{{- else }}
{{ include "saw-users.application" (dict
  "root" $
  "user" $user
  "appName" (printf "saw-%s" $user.name)
  "wave" $.Values.syncWave.sandbox
  "path" "charts/openshell-saw"
  "release" $user.name
  "ignoreVMDefaults" true
  "values" (include "saw-users.openshellValues" (dict "root" $ "user" $user))
) }}
{{- end }}
{{- end }}
