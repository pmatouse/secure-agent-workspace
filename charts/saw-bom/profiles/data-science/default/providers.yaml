apiVersion: saw.redhat.com/v1alpha1
kind: Providers
metadata:
  profile: data-science
spec:
  providers:
  - credentialSecret: inference
    credentialSecretKey: api_key
    name: openai
    type: openai
  - credentialSecret: web-search
    credentialSecretKey: api_key
    enabled: false
    name: brave
    type: brave
  - credentialSecret: inference-anthropic
    credentialSecretKey: api_key
    enabled: false
    name: anthropic
    type: anthropic
