apiVersion: saw.redhat.com/v1alpha1
kind: Providers
metadata:
  profile: data-science
spec:
  providers:
    - name: openai
      type: openai
      credentialSecret: inference
      credentialSecretKey: api_key
    - name: brave
      type: brave
      credentialSecret: web-search
      credentialSecretKey: api_key
    # Optional additional API; enable it before attaching it to a sandbox.
    - name: anthropic
      type: anthropic
      enabled: false
      credentialSecret: inference-anthropic
      credentialSecretKey: api_key
