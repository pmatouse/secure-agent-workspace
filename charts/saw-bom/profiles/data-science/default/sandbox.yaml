apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
  - name: notebook
    type: openclaw
    enabled: true
    image: quay.io/aipcc/base-images/agentic/openclaw@sha256:896d1526ee29b53167034ba65d1c758c8da777f441ed094e19f3bcf6d7445c61
    providers:
    - openai
    harnessRef:
      name: ds-default
    inference:
      providerRef: openai
      model:
        secretKeyRef:
          name: inference
          key: model
        default: gpt-4.1-mini
        title: Model (notebook)
      protocol: openai
      baseUrl: https://api.openai.com/v1
    ui:
      route: true
  - name: cuda-sandbox
    type: nemoclaw
    enabled: false
    agent: openclaw
    image: ghcr.io/validatedpatterns-sandbox/nemoclaw-sandbox:latest
    providers:
    - openai
  - name: toolbox
    type: generic
    enabled: false
    image: base
    providers:
    - openai
