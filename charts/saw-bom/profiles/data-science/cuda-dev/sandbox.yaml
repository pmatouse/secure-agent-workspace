apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
  - name: cuda-sandbox
    type: nemoclaw
    enabled: true
    agent: openclaw
    image: ghcr.io/validatedpatterns-sandbox/nemoclaw-sandbox:latest
    providers:
    - openai
    inference:
      providerRef: openai
      model:
        secretKeyRef:
          name: inference
          key: cuda_model
        default: gpt-4.1-mini
        title: Model (cuda-sandbox)
      protocol: openai
      baseUrl: https://api.openai.com/v1
    ui:
      route: true
  - name: toolbox
    type: generic
    enabled: false
    image: base
    providers:
    - openai
