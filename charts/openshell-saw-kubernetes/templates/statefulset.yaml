apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openshell-k8s.fullname" . }}-gateway
  labels:
    {{- include "openshell-k8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  serviceName: {{ include "openshell-k8s.fullname" . }}-gateway
  selector:
    matchLabels:
      {{- include "openshell-k8s.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "openshell-k8s.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-gateway.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "openshell-k8s.gatewaySA" . }}
      securityContext:
        fsGroup: 1000
      containers:
        # --- OpenShell Gateway ---
        - name: openshell-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          args:
            - "--config"
            - "/etc/openshell/gateway.toml"
          env:
            - name: HOME
              value: /var/lib/openshell
            - name: OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openshell-k8s.fullname" . }}-credential-key
                  key: key
                  optional: true
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/openshell
              readOnly: true
            - name: tls-cert
              mountPath: /etc/openshell-tls/server
              readOnly: true
            - name: tls-client-ca
              mountPath: /etc/openshell-tls/client-ca
              readOnly: true
            - name: jwt-keys
              mountPath: /etc/openshell-jwt
              readOnly: true
            - name: gateway-data
              mountPath: /var/lib/openshell
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}

        # --- Codex WebSocket Forward Sidecar ---
        - name: codex-forward
          image: {{ .Values.provision.jobImage }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
          env:
            - name: KC_TOKEN_URL
              value: "{{ include "openshell-k8s.oidcIssuerUrl" . }}/protocol/openid-connect/token"
            - name: RT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "openshell-k8s.fullname" . }}-runtime-client
                  key: client_id
            - name: RT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "openshell-k8s.fullname" . }}-runtime-client
                  key: client_secret
            - name: OIDC_ISSUER
              value: "{{ include "openshell-k8s.oidcIssuerUrl" . }}"
            - name: OIDC_AUDIENCE
              value: "{{ .Values.oidc.clientId }}"
          command:
            - bash
            - -c
            - |
              echo "Waiting for gateway to be ready..."
              until curl -sf http://localhost:8081/healthz 2>/dev/null; do
                sleep 2
              done
              echo "Gateway ready."

              write_gw_config() {
                GW_DIR="$HOME/.config/openshell/gateways/local-gw"
                mkdir -p "$GW_DIR/mtls"
                cp /etc/client-tls/ca.crt "$GW_DIR/mtls/ca.crt"
                python3 -c "
              import json
              json.dump({'name':'local-gw','gateway_endpoint':'https://localhost:8080',
                'is_remote':False,'gateway_port':8080,'auth_mode':'oidc',
                'oidc_issuer':'$OIDC_ISSUER','oidc_client_id':'$RT_CLIENT_ID',
                'oidc_audience':'$OIDC_AUDIENCE'},
                open('$GW_DIR/metadata.json','w'))
              json.dump({'access_token':'$1','issuer':'$OIDC_ISSUER',
                'client_id':'$RT_CLIENT_ID'},
                open('$GW_DIR/oidc_token.json','w'))
              "
              }

              BACKOFF=2
              MAX_BACKOFF=60
              while true; do
                RESPONSE=$(curl -sf --connect-timeout 5 --max-time 10 -X POST "$KC_TOKEN_URL" \
                  -d "grant_type=client_credentials" \
                  --data-urlencode "client_id=$RT_CLIENT_ID" \
                  --data-urlencode "client_secret=$RT_CLIENT_SECRET" 2>/dev/null)
                if [ $? -ne 0 ] || [ -z "$RESPONSE" ]; then
                  echo "WARN: token endpoint unreachable, retrying in ${BACKOFF}s" >&2
                  sleep "$BACKOFF"
                  BACKOFF=$((BACKOFF * 2 > MAX_BACKOFF ? MAX_BACKOFF : BACKOFF * 2))
                  continue
                fi
                PARSED=$(echo "$RESPONSE" | python3 -c "
              import sys, json
              try:
                  d = json.load(sys.stdin)
                  at, ei = d['access_token'], int(d.get('expires_in', 300))
                  if ei < 30:
                      print('ERROR: token too short', file=sys.stderr); sys.exit(1)
                  print(f'{at}\n{ei}')
              except (KeyError, json.JSONDecodeError) as e:
                  print(f'ERROR: {e}', file=sys.stderr); sys.exit(1)
              " 2>/dev/null)
                if [ $? -ne 0 ] || [ -z "$PARSED" ]; then
                  echo "WARN: invalid token, retrying in ${BACKOFF}s" >&2
                  sleep "$BACKOFF"
                  BACKOFF=$((BACKOFF * 2 > MAX_BACKOFF ? MAX_BACKOFF : BACKOFF * 2))
                  continue
                fi
                TOKEN=$(echo "$PARSED" | head -1)
                EXPIRES_IN=$(echo "$PARSED" | tail -1)
                BACKOFF=2
                write_gw_config "$TOKEN"
                RENEWAL=$(( EXPIRES_IN * 4 / 5 ))
                echo "Token acquired (expires_in=${EXPIRES_IN}s, renewal in ${RENEWAL}s)"
                timeout "$RENEWAL" openshell --gateway local-gw forward service codex \
                  --target-port {{ .Values.forward.port }} \
                  --local 0.0.0.0:{{ .Values.forward.port }} || true
                sleep 2
              done
          ports:
            - name: codex-ws
              containerPort: {{ .Values.forward.port }}
              protocol: TCP
          volumeMounts:
            - name: tls-client-ca
              mountPath: /etc/client-tls
              readOnly: true
          resources:
            {{- toYaml .Values.resources.forward | nindent 12 }}

        # --- Governance Interceptor Sidecar ---
        - name: governance-interceptor
          image: {{ .Values.governance.interceptorImage }}
          imagePullPolicy: Always
          args:
            - --listen
            - "0.0.0.0:{{ .Values.governance.port }}"
            - --policy
            - /config/policy/policy.yaml
            - --profiles
            - /config/profiles
            - --gateway-endpoint
            - "http://localhost:8080"
          ports:
            - name: governance
              containerPort: {{ .Values.governance.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: {{ .Values.governance.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: governance-policy
              mountPath: /config/policy
              readOnly: true
            - name: governance-profiles
              mountPath: /config/profiles
              readOnly: true
          resources:
            {{- toYaml .Values.resources.interceptor | nindent 12 }}

      volumes:
        - name: gateway-config
          configMap:
            name: {{ include "openshell-k8s.fullname" . }}-gateway-config
        - name: tls-cert
          secret:
            secretName: {{ include "openshell-k8s.fullname" . }}-tls
        - name: tls-client-ca
          secret:
            secretName: {{ include "openshell-k8s.fullname" . }}-client-ca
        - name: jwt-keys
          secret:
            secretName: {{ include "openshell-k8s.fullname" . }}-jwt-keys
        - name: governance-policy
          configMap:
            name: governance-policy
            optional: true
        - name: governance-profiles
          configMap:
            name: governance-profiles
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: gateway-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.gatewayData.storageClass }}
        storageClassName: {{ .Values.gatewayData.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.gatewayData.size }}
